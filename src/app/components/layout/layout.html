@if (auth.isLoggedIn()) {
  <div class="infinite"  weatherInfiniteScroll (addRow)="loadMore()" >
    @for (people of infiniteUsers(); track $index) {
      <div class="item">{{people?.name}}</div>
    }
    <div  class="sentinel"></div>
  </div>
  <button class="logout-btn" (click)="logout()">
    Log out
  </button>

} @else {

  <weather-login/>

}
