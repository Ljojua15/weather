<div class="mb-8">
  <div class="flex bg-gray-800 rounded-lg p-1 overflow-x-auto">
    @for (tabs of weatherTabs; track $index) {
      <button
        [class.tab-active]="$index === activeWeatherTab()"
        (click)="changeWeatherTabs($index)"
        id="current-tab"
        class="px-6 py-3 rounded-lg mr-2 text-sm font-medium transition-all duration-200 !rounded-button whitespace-nowrap tab-inactive"
      >
        {{ tabs }}
      </button>
    }
  </div>
</div>
